version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: BookFlix_DB
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    healthcheck:
      # Tests if SQL Server is ready to receive commands
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mssql_data:/var/opt/mssql

  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sqlpackage 
      /Action:Publish 
      /SourceFile:/dacpac/BookFlix.Database.dacpac 
      /TargetServerName:db 
      /TargetDatabaseName:BookFlix 
      /TargetUser:sa 
      /TargetPassword:${MSSQL_SA_PASSWORD} 
      /TargetEncryptConnection:False
      /TargetTrustServerCertificate:True

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=BookFlix;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
    depends_on:
      db-migrator:
        condition: service_completed_successfully

volumes:
  mssql_data:
